name: LearnersHigh CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learnershigh-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  harness:
    name: Harness / Repository Rules
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify harness
        run: |
          .\scripts\verify.ps1 -SkipFrontend -SkipBackend

  frontend:
    name: Frontend
    needs: harness
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend scaffold
        id: frontend-meta
        run: |
          $ErrorActionPreference = "Stop"

          $packageJsonFiles = @(
            Get-ChildItem -Path ".\frontend" -Filter "package.json" -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '[\\/](node_modules|dist|build|coverage|\.vite)[\\/]'
              }
          )

          $hasFrontend = $packageJsonFiles.Count -gt 0
          "has_frontend=$($hasFrontend.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if (-not $hasFrontend) {
            Write-Host "No frontend package.json detected. Frontend job will be skipped."
          }

      # Node.js는 major 22만 확정되어 있다. exact patch version은 고정하지 않는다.
      - name: Setup Node.js 22
        if: steps.frontend-meta.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show Node environment
        if: steps.frontend-meta.outputs.has_frontend == 'true'
        run: |
          node --version
          npm --version

      # Package Manager 정책: npm only. package-lock.json 외 Lockfile은 실패 처리한다.
      - name: Install frontend dependencies (npm ci)
        if: steps.frontend-meta.outputs.has_frontend == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $repoRoot = (Resolve-Path ".").Path
          $frontendDir = Join-Path $repoRoot "frontend"
          $forbiddenLockfiles = @("pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb")

          $forbidden = @(
            Get-ChildItem -LiteralPath $repoRoot -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in $forbiddenLockfiles }
          ) + @(
            Get-ChildItem -LiteralPath $frontendDir -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -in $forbiddenLockfiles -and
                $_.FullName -notmatch '[\\/]node_modules[\\/]'
              }
          )

          if ($forbidden.Count -gt 0) {
            throw "npm 외 Package Manager의 Lockfile이 발견되었습니다 (npm only):`n- $(($forbidden.FullName) -join "`n- ")"
          }

          function Find-NpmLockRoot {
            param([string]$ProjectDir, [string]$StopDir)

            $current = (Resolve-Path -LiteralPath $ProjectDir).Path
            $stop = (Resolve-Path -LiteralPath $StopDir).Path

            while ($true) {
              if (Test-Path -LiteralPath (Join-Path $current "package-lock.json")) {
                return $current
              }

              if ($current -eq $stop) {
                break
              }

              $parent = Split-Path -Parent $current

              if ([string]::IsNullOrWhiteSpace($parent) -or $parent -eq $current) {
                break
              }

              $current = $parent
            }

            return $null
          }

          $frontendRootPackage = Join-Path $frontendDir "package.json"

          if (Test-Path -LiteralPath $frontendRootPackage) {
            $packageJsonFiles = @($frontendRootPackage)
          }
          else {
            $packageJsonFiles = @(
              Get-ChildItem -LiteralPath $frontendDir -Filter "package.json" -File -Recurse |
                Where-Object {
                  $_.FullName -notmatch '[\\/](node_modules|dist|build|coverage|\.vite)[\\/]'
                } |
                Sort-Object FullName |
                Select-Object -ExpandProperty FullName
            )
          }

          if ($packageJsonFiles.Count -eq 0) {
            throw "Frontend scaffold was detected earlier, but no package.json can be found now."
          }

          $installedRoots = @{}

          foreach ($packageJsonPath in $packageJsonFiles) {
            $projectDir = Split-Path -Parent $packageJsonPath
            $packageJson = Get-Content -LiteralPath $packageJsonPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $packageManagerProperty = $packageJson.PSObject.Properties["packageManager"]

            if ($null -ne $packageManagerProperty -and [string]$packageManagerProperty.Value -notmatch '^npm@') {
              throw "package.json의 packageManager가 npm이 아닙니다: $($packageManagerProperty.Value) ($packageJsonPath)"
            }

            $installRoot = Find-NpmLockRoot -ProjectDir $projectDir -StopDir $frontendDir

            if ($null -eq $installRoot) {
              throw "CI에서는 npm package-lock.json이 필요합니다: $projectDir"
            }

            if ($installedRoots.ContainsKey($installRoot)) {
              continue
            }

            $installedRoots[$installRoot] = $true

            Write-Host ""
            Write-Host "Installing dependencies (npm ci)"
            Write-Host "Root: $installRoot"

            Push-Location $installRoot

            try {
              npm ci

              if ($LASTEXITCODE -ne 0) {
                throw "npm ci failed: $installRoot"
              }
            }
            finally {
              Pop-Location
            }
          }

      - name: Verify frontend
        if: steps.frontend-meta.outputs.has_frontend == 'true'
        run: |
          .\scripts\verify-frontend.ps1 -Strict

      - name: Frontend not scaffolded yet
        if: steps.frontend-meta.outputs.has_frontend != 'true'
        run: |
          Write-Host "frontend package.json이 없어 Frontend 검증을 실행하지 않았습니다."
          Write-Host "Harness 단계에서는 정상이며, scaffold가 추가되면 이 job이 자동으로 활성화됩니다."

  backend:
    name: Backend
    needs: harness
    # Testcontainers(MySQL)에 Docker가 필요하다. Windows Runner는 Linux Container를 쓸 수 없어 Ubuntu에서 실행한다 (ADR-0006).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend scaffold
        id: backend-meta
        run: |
          $ErrorActionPreference = "Stop"

          $buildFiles = @(
            @(
              "./backend/build.gradle",
              "./backend/build.gradle.kts"
            ) | Where-Object { Test-Path -LiteralPath $_ }
          )

          $hasBackend = $buildFiles.Count -gt 0
          "has_backend=$($hasBackend.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if (-not $hasBackend) {
            Write-Host "No backend Gradle build file detected. Backend job will be skipped."
          }

      # Java 21 = backend/build.gradle.kts의 toolchain languageVersion과 같아야 한다.
      - name: Setup Java 21
        if: steps.backend-meta.outputs.has_backend == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Show Java environment
        if: steps.backend-meta.outputs.has_backend == 'true'
        run: |
          java -version

      - name: Verify backend
        if: steps.backend-meta.outputs.has_backend == 'true'
        run: |
          ./scripts/verify-backend.ps1 -Strict

      - name: Backend not scaffolded yet
        if: steps.backend-meta.outputs.has_backend != 'true'
        run: |
          Write-Host "backend build file이 없어 Backend 검증을 실행하지 않았습니다."
          Write-Host "Harness 단계에서는 정상이며, scaffold가 추가되면 이 job이 자동으로 활성화됩니다."

  e2e:
    name: E2E (Playwright)
    needs:
      - frontend
      - backend
    # Backend(e2e Profile) + MySQL + Admin preview + Playwright를 한 Runner에서 띄운다 (ADR-0007).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: learnershigh_extension
          MYSQL_USER: learnershigh
          MYSQL_PASSWORD: learnershigh
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_PROFILES_ACTIVE: e2e
      # /api/test/**는 e2e Profile만으로 열리지 않는다. E2E Job에서만 명시적으로 켠다 (ADR-0007).
      LEARNERSHIGH_TEST_ENDPOINTS_ENABLED: "true"
      DB_URL: jdbc:mysql://127.0.0.1:3306/learnershigh_extension
      DB_USERNAME: learnershigh
      DB_PASSWORD: learnershigh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build backend
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      - name: Start backend (e2e profile)
        run: |
          jar=$(ls backend/build/libs/*.jar | grep -v plain | head -n 1)
          nohup java -jar "$jar" > backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/admin/student-care/branches > /dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          cat backend-e2e.log
          exit 1

      - name: Build and preview admin
        working-directory: frontend
        run: |
          npm ci
          npm run build --workspace=@learnershigh/admin
          nohup npm run preview --workspace=@learnershigh/admin -- --strictPort > ../admin-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4174/ > /dev/null; then
              echo "admin ready"
              exit 0
            fi
            sleep 1
          done
          cat ../admin-preview.log
          exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: e2e
        run: |
          npm run typecheck
          npm run test:ci

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            backend-e2e.log
            admin-preview.log
          retention-days: 7

  result:
    name: CI Result
    if: always()
    needs:
      - harness
      - frontend
      - backend
      - e2e
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate
        run: |
          $results = @{
            harness = "${{ needs.harness.result }}"
            frontend = "${{ needs.frontend.result }}"
            backend = "${{ needs.backend.result }}"
            e2e = "${{ needs.e2e.result }}"
          }

          $results.GetEnumerator() |
            Sort-Object Name |
            ForEach-Object {
              Write-Host "$($_.Name): $($_.Value)"
            }

          $failed = @(
            $results.GetEnumerator() |
              Where-Object {
                $_.Value -notin @("success", "skipped")
              }
          )

          if ($failed.Count -gt 0) {
            throw "One or more CI jobs failed."
          }

          Write-Host "LearnersHigh CI PASS"
