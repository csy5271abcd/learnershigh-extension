    note: '과목별 파일 33개. 원문은 요약 표의 <b>평가 방법</b> 행에 과제 이름이 있는 양식입니다. 자동 확정한 32과목은 원문과 모두 같고, 남은 1과목은 원문 요약 표에 과제가 없어 <b>확인 필요</b>로 넘겼습니다.'
  },
  gyewon: {
    name: '계원예술고등학교', rows: DATA.gyewon, missing: DATA.gyewonMissing,
    note: '학년·학과별 파일 18개, 147과목. 학과마다 표 모양이 달라 여러 오류 유형이 나옵니다. <b>확인 필요</b>로 걸러진 오류와, 걸러지지 않고 자동 확정된 오류를 나눠 볼 수 있습니다.'
  }
};
const VERDICT = { 'O': '원문과 같음', 'X': '일부 다름', 'X-MISS': '과제를 놓침', 'X-FAKE': '없는 과제·과목', 'MISSING': '과목 빠짐' };

let cur = 'daewon', filter = 'all';
function verdictOf(r) {
  if (r.verdict === 'CHECK') return 'X-MISS';
  return r.verdict;
}
function render() {
  const sc = SCHOOLS[cur];
  const rows = sc.rows;
  const auto = rows.filter(r => !r.check.length);
  const flagged = rows.filter(r => r.check.length);
  const ok = rows.filter(r => verdictOf(r) === 'O');
  const autoOk = auto.filter(r => verdictOf(r) === 'O');
  const autoBad = auto.length - autoOk.length;
  const flaggedBad = flagged.filter(r => verdictOf(r) !== 'O').length;
  const total = rows.length + sc.missing.length;

  document.getElementById('note').innerHTML = `<p>${sc.note}</p>`;
  document.getElementById('summary').innerHTML = [
    [`${ok.length}/${total}`, '원문과 같은 과목'],
    [`${Math.round(ok.length / total * 1000) / 10}%`, '정답률'],
    [`${autoOk.length}/${auto.length}`, '자동 확정 중 정답'],
    [`${flaggedBad}/${flagged.length}`, '확인 필요 중 실제 오류'],
    [`${autoBad + sc.missing.length}`, '못 걸러낸 오류']
  ].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');

  const segs = [
    ['var(--ok)', autoOk.length, '자동 확정 · 정답'],
    ['var(--warn)', flaggedBad, '확인 필요 · 실제 오류'],
    ['var(--accent)', flagged.length - flaggedBad, '확인 필요 · 실제로는 정답'],
    ['var(--bad)', autoBad + sc.missing.length, '못 걸러낸 오류']
  ];
  document.getElementById('bar').innerHTML = segs.map(([c, n]) => n ? `<i style="width:${n / total * 100}%;background:${c}"></i>` : '').join('');
  document.getElementById('legend').innerHTML = segs.map(([c, n, l]) => `<span style="--c:${c}">${l} ${n}</span>`).join('');

  const counts = {};
  rows.forEach(r => { const v = verdictOf(r); counts[v] = (counts[v] || 0) + 1; });
  if (sc.missing.length) counts['MISSING'] = sc.missing.length;
  const F = [['all', `전체 ${total}`], ['auto', `자동 확정 ${auto.length}`], ['flag', `확인 필요 ${flagged.length}`], ['silent', `못 걸러낸 오류 ${autoBad + sc.missing.length}`]]
    .concat(Object.keys(VERDICT).filter(k => counts[k] && k !== 'O').map(k => ['v:' + k, `${VERDICT[k]} ${counts[k]}`]));
  if (!F.some(f => f[0] === filter)) filter = 'all';
  document.getElementById('filters').innerHTML = '<span class="lab">거르기</span>' + F.map(([k, l]) =>
    `<button class="chip" id="f-${k.replace(':', '-')}" aria-pressed="${k === filter}" data-f="${k}">${l}</button>`).join('');

  let list = rows.map(r => ({ ...r, v: verdictOf(r) }));
  let miss = sc.missing.map(m => ({ ...m, v: 'MISSING' }));
  const keep = r => filter === 'all' || (filter === 'auto' && !r.check?.length && r.v !== 'MISSING')
    || (filter === 'flag' && r.check?.length) || (filter === 'silent' && (r.v === 'MISSING' || (!r.check.length && r.v !== 'O')))
    || (filter === 'v:' + r.v);
  const shown = list.concat(miss).filter(keep);
  document.getElementById('list').innerHTML = shown.length ? shown.map(row).join('') : '<p class="empty">이 조건에 맞는 과목이 없습니다.</p>';
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function row(r) {
  const vClass = r.v === 'O' ? 'v-o' : 'v-x';
  if (r.v === 'MISSING') {
    return `<details><summary><span class="subj">${esc(r.s)}<small>${esc(r.cat)}</small></span><span class="ratio">—</span>
      <span class="tasks"><span class="none">결과에 없음</span></span>
      <span class="pills"><span class="pill v-x">${VERDICT[r.v]}</span></span></summary>
      <div class="body"><p class="orig"><b>원문</b> ${esc(r.note)}</p></div></details>`;
  }
  const tasks = r.items.length ? r.items.map(i => `<span>${esc(i.n)}<em>${fmt(i.w)}</em></span>`).join('') : '<span class="none">과제 없음</span>';
  const st = r.check.length ? `<span class="pill check">확인 필요</span>` : `<span class="pill auto">자동 확정</span>`;
  const origText = r.orig ? r.orig : (r.v !== 'O' ? r.note : '');
  const rl = rules(r).map(([y, t]) => `<li><span class="m ${y ? 'y' : 'n'}">${y ? '✓' : '✗'}</span><span>${esc(t)}</span></li>`).join('');
  return `<details><summary><span class="subj">${esc(r.s)}<small>${esc(r.cat)}${r.file ? ' · ' + esc(r.file) : ''}</small></span>
    <span class="ratio">${fmt(r.exam)}/${fmt(r.perf)}</span><span class="tasks">${tasks}</span>
    <span class="pills">${st}<span class="pill ${vClass}">${VERDICT[r.v]}</span></span></summary>
    <div class="body"><ul class="rules">${rl}</ul>
    ${origText ? `<p class="orig"><b>원문 대조</b> ${esc(origText)}</p>` : '<p class="orig"><b>원문 대조</b> 과목명·비율·과제 이름·개수·과제별 비율이 모두 원문과 같음</p>'}</div></details>`;
}
document.getElementById('tabs').innerHTML = Object.entries(SCHOOLS).map(([k, s]) =>
  `<button class="tab" role="tab" id="t-${k}" data-k="${k}" aria-selected="${k === cur}">${s.name}</button>`).join('');
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  cur = b.dataset.k; filter = 'all';
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.k === cur));
  render();
});
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; render();
});
render();
</script>
