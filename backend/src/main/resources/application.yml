spring:
  application:
    name: learnershigh-extension

  # Extension MySQL 연결 정보는 환경 변수로만 주입한다. 값(특히 Password)을 이 파일에 쓰지 않는다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # Entity는 Service 밖으로 나가지 않는다 (ADR-0005). View 렌더링 중 Lazy Loading을 허용하지 않는다.
    open-in-view: false
    hibernate:
      # Schema 변경은 Migration으로만 관리한다 (.claude/rules/database.md). Hibernate가 Schema를 만들지 않는다.
      ddl-auto: none

  jackson:
    deserialization:
      # 정수 필드에 소수(2.5)가 오면 잘라 저장하지 않고 400 VALIDATION_ERROR로 거부한다 (api-contract.md §5-1).
      accept-float-as-int: false

app:
  # 기준일 계산 Timezone (shared-conventions.md §13)
  zone: Asia/Seoul

learnershigh:
  integration:
    # Existing LearnersHigh 실제 Client는 아직 없다 (Open Decision: api-contract.md API-OD-07, domain.md §1).
    # 그때까지 mock을 명시적으로 쓴다. 다른 값이면 ExistingXxxClient Bean이 없어 Application이 시작하지 않는다.
    mode: mock
  mock:
    # 비어 있으면 Application 시작일을 시연 기준일로 쓴다.
    anchor-date:

---
# E2E (ADR-0007): 기준일 고정 + 조정 가능한 Clock + /api/test/** 등록
# /api/test/**는 e2e Profile과 learnershigh.test-endpoints.enabled=true가 둘 다 있을 때만 등록된다.
spring:
  config:
    activate:
      on-profile: e2e

app:
  fixed-date: 2026-09-30

learnershigh:
  mock:
    anchor-date: 2026-09-30
  test-endpoints:
    enabled: true
