# 시험 전용 설정 (2026-11-16, A23). classpath:/config/application.yml은 classpath:/application.yml(main)보다 우선한다.
# main application.yml이 Railway 분석기(실제 주소·토큰)와 실험 기능을 기본으로 켜도록 바뀐 뒤에도,
# 시험은 A22까지의 기본값(분석기 미설정 → 503, 실험 기능 꺼짐)으로 돈다. 그래서:
#  - 분석기를 따로 지정하지 않은 @SpringBootTest가 원격(Railway)으로 요청을 보내지 않는다(시험 문서 원격 전송 금지).
#  - 분석기·실험 기능이 필요한 시험은 지금처럼 @SpringBootTest properties로 Stub 주소·값을 넣는다(이 파일보다 우선).
# 이 파일은 시험 클래스패스에만 있어 bootJar·bootRun에는 들어가지 않는다.
assessment:
  analysis-import:
    contract03-enabled: false
  multiformat:
    experimental: false
  analyzer:
    base-url: ""
    token: ""
    version: v21.1
    contract03-version: v21.4-dev
    timeout-millis: 130000
  preview:
    converter:
      mode: none
      auto-provision: false
