# 시험 전용 설정. classpath:/config/application.yml은 classpath:/application.yml(main)보다 우선한다.
# 시험 기본값은 분석기 미설정(503) · 실험 기능 꺼짐이다.
#  - 서버 안 분석기가 필요한 시험은 properties 로 mode=local 을 준다.
#  - 분석 결과 저장 규칙 시험은 StubPlanAnalyzer 를 @Primary Bean 으로 넣는다.
# 이 파일은 시험 클래스패스에만 있어 bootJar·bootRun에는 들어가지 않는다.
assessment:
  analysis-import:
    contract03-enabled: false
  multiformat:
    experimental: false
  analyzer:
    # 시험 기본값: 분석기 미설정(503) 경로를 그대로 시험한다. 서버 안 분석기 시험은 properties 로 mode=local 을 준다
    mode: none
    version: v21.1
    contract03-version: v21.4-dev
    timeout-millis: 130000
  preview:
    converter:
      mode: none
      auto-provision: false
