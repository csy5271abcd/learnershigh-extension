<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학부모 리포트 생활 탭 · 시안 B</title>
<link rel="stylesheet" href="life.css">
<style>
  /* 시안 B: 원본 주간 레포트 꼴 그대로. 반원 게이지(출석률) + 도장 줄, '최근 5주 간 …' 막대, 맨 아래 선생님 코멘트 칸 */
  .gauge { display: grid; justify-items: center; gap: 2px; padding-top: 6px; }
  .gauge .num { margin-top: -62px; font-size: 30px; font-weight: 800; color: var(--r-cyan); }
  .gauge .lab { font-size: 13px; color: var(--r-sub); }
  .gauge .sub { font-size: 13px; color: var(--r-ink); margin-top: 4px; }
  .gauge .sub b { color: var(--r-yellow); }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--r-card); border-radius: 14px; padding: 12px; display: grid; gap: 4px; }
  .tile span { font-size: 12px; color: var(--r-sub); }
  .tile b { font-size: 20px; color: var(--r-cyan); font-variant-numeric: tabular-nums; }
  .tile b.warn { color: var(--r-yellow); }
  .tile small { font-size: 12px; color: var(--r-sub); }
  .comment { background: #d9dbe0; color: #26282c; border-radius: 14px; padding: 14px; }
  .comment h5 { margin: 0 0 6px; font-size: 13px; color: #555a63; }
  .comment p { margin: 0; white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
  .comment .tag { display: inline-block; margin-bottom: 6px; padding: 2px 8px; border-radius: 6px; background: #26282c; color: var(--r-cyan); font-size: 11px; font-weight: 700; }
</style>
</head>
<body>
<div class="page">
  <header class="page-title"><h1>학부모 리포트 · 생활 탭</h1><p>시안 B · 원본 주간 레포트 꼴(게이지·도장·최근 5주 막대·선생님 코멘트)</p><nav><a href="a.html">시안 A</a><a href="b.html" aria-current="page">시안 B</a></nav></header>
  <section class="admin" id="admin" aria-label="관리자 레포트 전송"></section>
  <div class="phone"><div class="screen" id="screen" aria-label="학부모가 받는 화면"></div></div>
</div>
<script src="life.js"></script>
<script src="admin.js"></script>
<script>
(function () {
  var hm = LifeReport.hm, clock = LifeReport.clock, md = LifeReport.md, KIND = LifeReport.KIND
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c] }) }

  // 원본 순공률 게이지와 같은 반원
  function gauge(pct) {
    var a = Math.PI * (1 - Math.min(1, Math.max(0, pct / 100))), r = 80, cx = 100, cy = 96
    var x = cx + r * Math.cos(a), y = cy - r * Math.sin(a)
    return '<svg viewBox="0 0 200 110" width="220" role="img" aria-label="출석률 ' + pct + '%"><path d="M20,96 A80,80 0 0 1 180,96" fill="none" stroke="#1b1c1f" stroke-width="22"/>' +
      (pct > 0 ? '<path d="M20,96 A80,80 0 0 1 ' + x.toFixed(1) + ',' + y.toFixed(1) + '" fill="none" stroke="var(--r-cyan)" stroke-width="22"/>' : '') + '</svg>'
  }
  // 원본 '최근 5주 간 순공시간 비교'와 같은 막대(이번 주만 강조)
  function weeksBar(vals, labels, fmt, unitTick, aria) {
    var W = 360, H = 180, Lp = 46, T = 22, B = 30, cw = (W - Lp - 8) / vals.length, mx = Math.max.apply(null, vals.filter(function (v) { return v !== null }).concat([1])) * 1.15
    var Y = function (v) { return T + (1 - v / mx) * (H - T - B) }, g = ''
    ;[0, .5, 1].forEach(function (f) { var v = mx / 1.15 * f; g += '<line x1="' + Lp + '" x2="' + (W - 8) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" class="r-grid"/><text x="' + (Lp - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" class="r-axis">' + unitTick(v) + '</text>' })
    vals.forEach(function (v, i) {
      var x = Lp + cw * i + cw * .22, w = cw * .56, last = i === vals.length - 1
      // 기록이 없는 주(등록 전·연동 누락)는 0이 아니라 '기록 없음'
      if (v === null) { g += '<text x="' + (x + w / 2) + '" y="' + (Y(0) - 6) + '" text-anchor="middle" class="r-axis">기록 없음</text><text x="' + (x + w / 2) + '" y="' + (H - 10) + '" text-anchor="middle" class="r-x">' + labels[i] + '</text>'; return }
      if (v > 0) g += '<rect x="' + x + '" y="' + Y(v) + '" width="' + w + '" height="' + (Y(0) - Y(v)) + '" rx="4" class="r-bar' + (last ? '' : ' old') + '"/>'
      g += '<text x="' + (x + w / 2) + '" y="' + (Y(v) - 6) + '" text-anchor="middle" class="r-axis" style="fill:' + (last ? 'var(--r-cyan)' : 'var(--r-sub)') + ';font-weight:700">' + fmt(v) + '</text>'
      g += '<text x="' + (x + w / 2) + '" y="' + (H - 10) + '" text-anchor="middle" class="r-x"' + (last ? ' style="fill:#fff;font-weight:700"' : '') + '>' + labels[i] + '</text>'
    })
    return '<div class="r-plot"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + aria + '">' + g + '</svg></div>'
  }

  function render(L, attached) {
    var S = LifeReport.sentences(L)
    var rate = L.attend.scheduled ? Math.round(L.attend.present / L.attend.scheduled * 100) : null
    var labels = ['4주전', '3주전', '2주전', '1주전', '이번주']
    var stamps = L.days.map(function (d, i) {
      return '<div><div class="d' + (i === L.days.length - 1 ? ' today' : '') + '">' + d.dow + '</div><div class="stamp ' + d.state + '">' + (d.state === 'present' ? '✓' : d.state === 'absent' ? '결' : d.state === 'off' ? '쉼' : L.newbie && L.newbie.first && d.date < L.newbie.first ? '전' : '–') + '</div><div class="t">' + (d.state === 'present' && d.start !== null ? (Math.floor(d.start / 60) % 24) + ':' + String(Math.round(d.start) % 60).padStart(2, '0') : '') + '</div></div>'
    }).join('')
    var lateText = L.lateAvg === null ? '–' : Math.abs(L.lateAvg) < 10 ? '평소와 같음' : hm(L.lateAvg) + (L.lateAvg > 0 ? ' 늦게' : ' 일찍')
    var studyPct = L.week.usual ? Math.round(L.week.minutes / L.week.usual * 100) : null
    var focusUp = S.focusUp && S.focusUp.length
    var focusWeeks = L.focus.weekly
    return '<div class="r-body">' +
        '<section class="r-sec"><div class="r-card"><div class="gauge">' + gauge(rate || 0) + '<div class="num">' + (rate === null ? '–' : rate + '%') + '</div><div class="lab">출석률</div><div class="sub">' + (rate === null ? S.attend : '예정 ' + L.attend.scheduled + '일 중 <b>' + L.attend.present + '일</b> 출석 · 계획 제출 ' + L.attend.planned + '일') + '</div></div></div>' +
          '<div class="r-card dark" style="margin-top:8px"><div class="stamps">' + stamps + '</div></div></section>' +
        '<section class="r-sec"><h4>이번 주 생활 변화</h4><div class="tiles">' +
          '<div class="tile"><span>입실 시각</span><b class="' + (L.lateAvg !== null && L.lateAvg >= 30 ? 'warn' : '') + '">' + lateText + '</b><small>평균 입실 ' + (L.startAvg === null ? '–' : clock(L.startAvg)) + '</small></div>' +
          '<div class="tile"><span>공부 시간</span><b class="' + (studyPct !== null && studyPct < 70 ? 'warn' : '') + '">' + (!L.known.recent ? '–' : studyPct === null ? hm(L.week.minutes) : '평소의 ' + studyPct + '%') + '</b><small>이번 주 ' + hm(L.week.minutes) + (L.week.usual ? ' · 평소 ' + hm(L.week.usual) : '') + '</small></div>' +
          '<div class="tile"><span>늦게 온 날(1시간 이상)</span><b class="' + (L.lateDays ? 'warn' : '') + '">' + L.lateDays + '일</b><small>입실 ' + L.attend.present + '일 중</small></div>' +
          '<div class="tile"><span>공부 중 흐트러짐</span><b class="' + (focusUp ? 'warn' : '') + '">' + (L.focus.hasData ? L.focus.total + '회' : '–') + '</b><small>' + (L.focus.hasData ? '평소 한 주 ' + Math.round(L.focus.priorTotal * 10) / 10 + '회' : '관찰 기록 없음') + '</small></div>' +
        '</div></section>' +
        '<section class="r-sec"><h4>최근 5주 간 공부 시간 비교</h4><div class="r-card">' + weeksBar(L.week.weeks.map(function (v, i) { return L.known.weeks[i] ? v : null }), labels, function (v) { return v ? Math.round(v / 60) + '시간' : '' }, function (v) { return Math.round(v / 60) + '시간' }, '최근 5주 공부 시간') + '</div></section>' +
        '<section class="r-sec"><h4>최근 5주 간 공부 중 흐트러진 횟수</h4><div class="r-card">' + (L.focus.hasData ? '<p class="r-sent" style="font-size:14px">' + S.focus + '</p>' + weeksBar(focusWeeks.map(function (v, i) { return L.known.weeks[i] ? v : null }), labels, function (v) { return v + '회' }, function (v) { return Math.round(v) + '회' }, '최근 5주 흐트러진 횟수') +
          '<p class="r-muted">' + Object.keys(KIND).map(function (k) { return KIND[k] + ' ' + L.focus.recent[k] + '회' }).join(' · ') + ' (이번 주)</p>' : '<p class="r-muted">공부 중 관찰 기록이 없어요.</p>') + '</div></section>' +
        '<section class="r-sec"><h4>선생님 코멘트</h4><div class="comment">' + (attached.length ? attached.map(function (a) { return '<span class="tag">상담 기록</span><p>' + esc(a.text) + '</p>' }).join('<hr style="border:0;border-top:1px solid #b9bcc4;margin:10px 0">') : '<p style="color:#6b7079">원본 리포트의 선생님 코멘트가 이 자리에 그대로 나옵니다. 상담 기록을 고르면 그 아래에 덧붙습니다.</p>') + '</div></section>' +
      '</div>'
  }
  mountMock(render)
})()
</script>
</body>
</html>
